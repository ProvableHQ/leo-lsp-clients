name: build-zed-extension

on:
  pull_request:
    paths:
      - "packages/zed/**"
      - ".github/workflows/build-zed-extension.yml"
  push:
    branches: [master]
    paths:
      - "packages/zed/**"

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node deps
        # Required: validate.sh invokes the workspace-private leo-lsp-smoke /
        # discover CLIs, which need node_modules (vscode-jsonrpc).
        run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - name: Build extension
        working-directory: packages/zed
        run: cargo build --release --target wasm32-wasip2
      - name: Cache Zed for headless run
        run: |
          curl -L https://zed.dev/api/releases/stable/latest/Zed.dmg -o /tmp/Zed.dmg
          hdiutil attach /tmp/Zed.dmg -nobrowse -quiet
          cp -R "/Volumes/Zed/Zed.app" /Applications/
          hdiutil detach "/Volumes/Zed" -quiet
      - name: Build leo-lsp from ProvableHQ/leo
        uses: ./.github/actions/build-leo-lsp
      - name: Validate
        run: bash packages/zed/scripts/validate.sh
        env:
          ZED_BIN: /Applications/Zed.app/Contents/MacOS/cli
